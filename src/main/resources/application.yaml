spring:
  application:
    name: ai-recruitment-agent

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/recruitment}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

app:
  allowed-origins:
    - ${FRONTEND_URL:http://localhost:3000}
  security:
    api-key:
      header-name: ${API_KEY_HEADER_NAME:X-API-KEY}
    password-policy:
      min-length: ${PASSWORD_MIN_LENGTH:8}
      require-uppercase: ${PASSWORD_REQUIRE_UPPERCASE:true}
      require-lowercase: ${PASSWORD_REQUIRE_LOWERCASE:true}
      require-digit: ${PASSWORD_REQUIRE_DIGIT:true}
      require-special-character: ${PASSWORD_REQUIRE_SPECIAL:true}